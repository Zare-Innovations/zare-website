services:
  zare-landing-fe:
    image: landingpage/ui
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        # Public value, inlined into the client bundle at build time.
        NEXT_PUBLIC_API_URL: "https://landing.zareinnovations.com"
    environment:
      NEXT_PUBLIC_API_URL: "https://landing.zareinnovations.com"
      # Secrets are supplied at RUN time, never baked into the image.
      # Create a `.env.production` next to this file containing:
      #   RESEND_API_KEY=...
      #   CONTACT_FROM_EMAIL=Zare Website <noreply@zareinnovations.com>
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
    env_file:
      - .env.production
    ports:
      - "3555:3000"
    restart: always
